name: Extract MCM dylib symbols

on:
  workflow_dispatch:

jobs:
  extract:
    strategy:
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Dump libsystem_containermanager exports with dyld_info
        run: |
          set -euo pipefail
          mkdir -p out
          sw_vers > out/os.txt
          DYLIB=/usr/lib/system/libsystem_containermanager.dylib
          echo "=== exports ==="
          xcrun dyld_info -exports "$DYLIB" | tee out/exports.txt
          echo "=== platform ==="
          xcrun dyld_info -platform "$DYLIB" | tee out/platform.txt || true

      - name: Disassemble token-related functions
        run: |
          set -euo pipefail
          DYLIB=/usr/lib/system/libsystem_containermanager.dylib
          xcrun dyld_info -disassemble "$DYLIB" > out/disasm.txt 2>/dev/null || \
            xcrun dyld_info --disassemble "$DYLIB" > out/disasm.txt 2>/dev/null || \
            echo "disassembly not supported on this image" > out/disasm.txt
          wc -l out/disasm.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcm-symbols-${{ matrix.runner }}
          path: out/
